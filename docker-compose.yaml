services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE : "${DB_DATABASE}"
      MYSQL_USER : "${DB_USERNAME}"
      MYSQL_PASSWORD : "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD : "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
      retries: 3
      timeout: 5s
    ports:
      - "3306:3306"

  redis:
    image: redis:8.8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/var/lib/redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html/parser
      - vendor:/var/www/html/parser/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html/parser
    entrypoint: ['php', 'migrate.php']

  start-parser:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html/parser
    entrypoint: [ 'php', 'startParser.php' ]

volumes:
  db_data:
  redis_data:
  vendor: