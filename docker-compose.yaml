services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE : "${DB_DATABASE}"
      MYSQL_USER : "${DB_USERNAME}"
      MYSQL_PASSWORD : "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD : "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:8.8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/var/lib/redis
    ports:
      - "6379:6379"


volumes:
  db_data:
  redis_data: